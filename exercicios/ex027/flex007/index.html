<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-box</title>
    <style>
        .container{
            display: flex;
            flex-flow: row wrap;
            background-color: burlywood;
            padding: 5px;
        }
        .item{
            background-color: cadetblue;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
        }
        #id1{
            order: -3;
        }
        #id2{
            order: 2;
        }
        #id3{
            order: 1;
        }
        #id4{
            order: 0;
        }
        #id5{
            order: -4;
        }
        #id6{
            order: 7;
        }
        #id7{
            order: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="id1">A</div>
        <div class="item" id="id2">B</div>
        <div class="item" id="id3">C</div>
        <div class="item" id="id4">D</div>
        <div class="item" id="id5">E</div>
        <div class="item" id="id6">F</div>
        <div class="item" id="id7">G</div>
    </div>
</body>
</html>
