<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-box</title>
    <style>
        .container{
            display: flex;
            background-color: burlywood;
            
            flex-flow: row wrap;
        }
        .item{
            background-color: cadetblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">Testando o tamnho do conteúdo</div>
        <div class="item">C</div>
        <div class="item">esse flex-basis é interresante</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">eita que codar é bom</div>
        <div class="item">H</div>
    </div>
</body>
</html>
