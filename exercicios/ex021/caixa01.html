<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        body{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        h1{ /* block-level */
            background-color: darkgray;
            height: 50px;
            width: 300px;
            border: 10px solid red;
            padding: 30px;
            margin: auto;
            outline: 10px solid sandybrown;

        }
        a{ /* inline-level */
            background-color: darkgray;
            height: 50px;
            width: 300px;
            border: 10px solid red;
            padding: 10px;
            color: rgb(248, 242, 187);
            text-decoration: none;
            margin: auto;
            outline: 5px solid salmon;
            border-radius: 30px;
        }

    </style>
</head>
<body>
    <h1>Exemplo de box-level</h1>
    <p>Parágrafos também são exemplos de box level, <a href="#">já o link é um exemplo de inline-level</a>. Portanto é importante estudar essas propriedades.</p>
</body>
</html>
