<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de imagens</title>
</head>
<body>
    <h1>Testando imagens</h1>
    <p>Vamos testar a imagem fora da pasta:</p>
    <img src="css-full.jpg" alt="Logo do CSS">
    <p>Vamos testar a imagem dentro de uma pasta:</p>
    <img src="imagens/html-full.png" alt="Logo do HTML5">
    <p>Vamos testar a imagem por meio de um link(URL)</p>
    <img src="https://freesvg.org/img/1486641506.png" alt="Logo do JavaScript"> <!---URL-->
</body>
</html>
