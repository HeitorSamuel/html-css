<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        body{
            background-color: cadetblue;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="GET" autocomplete="on">

        <p>
            <label for="iest">Selecione o seu Estado:</label>
            <select name="estado" id="iest">
                <option value="">--- Selecione ---</option>
                <optgroup label="Nordeste">
                    <option value="PE">Pernambuco</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="PB">Paraíba</option>
                </optgroup>
                <optgroup label="Sudeste">
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="SP">São Paulo</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="ES">Espírito Santo</option>
                </optgroup>
            </select>
        </p>

        <p>
            <label for="iprof">Escolha a sua Profissão:</label>
            <input type="text" name="prof" id="iprof" list="listprof">
            <datalist id="listprof">
                <option value="CONT">Contador</option>
                <option value="DEV">Desenvolvedor</option>
                <option value="PROF">Professor</option>
                <option value="COZ">Cozinheiro</option>
                <option value="ADM">Administrador</option>
            </datalist>
        </p>
        <p>
            <label for="mens">Escreva uma Mensagem:</label><br><br>
            <textarea name="mensagem" id="mens" cols="30" rows="10  "></textarea>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="submit" value="Limpar">
        </p>
    </form>
</body>
</html>
