<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="GET" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
                <input type="radio" name="sexo" id="isxmasc" value="M">
                    <label for="isxmasc">Masculino</label><br>
                <input type="radio" name="sexo" id="isxfem" value="F">
                    <label for="isxfem">Feminino</label>
        </fieldset><br>
        <fieldset>
            <legend>Esportes Favoritos</legend>
                <input type="checkbox" name="basq" id="ibasq">
                    <label for="ibasq">Basquete</label><br>
                <input type="checkbox" name="fut" id="ifut">
                    <label for="ifut">Futebol</label><br>
                <input type="checkbox" name="volei" id="ivolei">
                    <label for="ivolei">Vôlei</label><br>
                <input type="checkbox" name="tenis" id="itenis">
                    <label for="itenis">Tênis</label><br>
                <input type="checkbox" name="natac" id="inatac">
                    <label for="inatac">Natação</label>
        
        </fieldset>
        
        <p>
            <input type="submit" value="Enviar">
            <input type="submit" value="Limpar">
        </p>
    </form>
</body>
</html>
