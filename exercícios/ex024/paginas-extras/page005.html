<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        body{
            background-color: cornflowerblue;
            color: azure;
        }
    </style>
</head>
<body>
    <a href="#" onclick="clicar()">Clique aqui!</a>
    <div id="saida"></div>

    <script>
        function clicar(){
            s = window.document.getElementById("saida")
            s.innerHTML += '<p>Você cliclou!</p>'
        }
    </script>
</body>
</html>
