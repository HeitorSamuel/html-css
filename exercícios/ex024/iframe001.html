<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando iframes</title>
    <style>
        iframe{
            width: 400px;
            height: 400px;
        }
    </style>
</head>
<body>
    <h1>Meu primeiro teste de iframes</h1>

    <p>Gustavo Guanabara é um professor da área de tecnologia e possui o site 
        <iframe src="https://www.cursoemvideo.com/" frameborder="1" scrolling="auto" height="500px">
            <a href="https://www.cursoemvideo.com/" target="_blank">CursoemVideo</a>
        </iframe>, além do canal no Youtube.</p>


    <p>Ademais, esse professor possui o canal no 
        <iframe src="https://www.youtube.com/" frameborder="0">
            <a href="https://www.youtube.com/" target="_blank">Youtube</a>
        </iframe>
        
    chamado CursoemVideo.
    </p>
</body>
</html>
