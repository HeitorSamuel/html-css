<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando links</title>
    <style>
        a{
            text-decoration: none;
            color: black;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
        }

        a:hover{
            color: red;
            text-decoration: underline;
        }

        a:visited{
            color: blue;
        }

        a:active{
            color: green;
        }

        .destaque::before{
            content: ">>";
        }

        .destaque::after{
            content: "<<";
        }

        .destaque:hover{
            background-color: darkred;
            color: white;
            text-decoration: underline;
            width: 100px;
        }

    </style>
</head>

<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://www.instagram.com/" target="_blank">Instagram</a></li>
        <li class="destaque"><a href="https://github.com/" target="_blank">Github</a></li>
        <li><a href="https://www.youtube.com/" target="_blank">Youtube</a></li>
    </ul>
</body>
</html>
