<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-box</title>
    <style>
        .container{
            display: flex;
            flex-flow: row-reverse wrap;
            background-color: burlywood;
            padding: 5px;
        }
        .item{
            background-color: cadetblue;
            border: 1px solid black;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item"> Exemplo do item A</div>
        <div class="item"> Exemplo do item B</div>
        <div class="item"> Exemplo do item C</div>
        <div class="item"> Exemplo do item D</div>
        <div class="item"> Exemplo do item E</div>
        <div class="item"> Exemplo do item F</div>
        <div class="item"> Exemplo do item G</div>
        <div class="item"> Exemplo do item H</div>
    </div>
</body>
</html>
