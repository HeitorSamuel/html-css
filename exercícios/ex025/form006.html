<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="POST" autocomplete="on">
        <p>
            <label for="icor">Selecione uma Cor:</label>
            <input type="color" name="cor" id="icor">
        </p>
        <p>
            <label for="isatisf">Nivel de Satisfação</label>
            <input type="range" name="satisf" id="isafisf" min="0" max="10" value="5">   
        </p>
        <p>
            <label for="ifoto">Selecione uma foto:</label>
            <input type="file" name="foto" id="ifoto">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
